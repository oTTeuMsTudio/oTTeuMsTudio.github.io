name: Deploy site

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch packaged Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p games/packaged/windows
          gh release download fgiu --repo "$GITHUB_REPOSITORY" --pattern 'FGIU-Windows.zip' --dir games/packaged/windows
          ls -lh games/packaged/windows

      - name: Stage site
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '_site' --exclude '.github' ./ _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
